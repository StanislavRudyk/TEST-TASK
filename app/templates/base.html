<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}channel-radar{% endblock %}</title>
    <meta name="description" content="Live analytics dashboard for public Telegram channels">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="header__logo">📡 <span>channel</span>-radar</a>
            <div class="header__nav">
                <span class="header__status">
                    {% if ai_available is defined and ai_available %}
                        <span class="status-dot status-dot--active"></span> AI active
                    {% else %}
                        <span class="status-dot status-dot--inactive"></span> AI offline
                    {% endif %}
                </span>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
